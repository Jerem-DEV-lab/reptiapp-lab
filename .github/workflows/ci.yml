name: CI

# Runner self-hosted Linux (VPS). Il doit être enregistré sur CE repo
# (ou au niveau de l'organisation Jerem-DEV-lab) :
# https://github.com/Jerem-DEV-lab/reptiapp-lab/settings/actions/runners
# Labels attendus : self-hosted, Linux
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Install & build
    runs-on: [self-hosted, Linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
